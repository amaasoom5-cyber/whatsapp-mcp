[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jina-whatsapp-mcp"
dynamic = ["version"]
description = "WhatsApp MCP Server — Manage Business templates & send messages via Meta Cloud API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nakul Beniwal", email = "nakulbeniwal16@gmail.com" },
]
keywords = [
    "whatsapp",
    "mcp",
    "model-context-protocol",
    "meta",
    "whatsapp-business",
    "templates",
    "chatgpt",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nakulben/whatsapp-mcp"
Repository = "https://github.com/nakulben/whatsapp-mcp"
Issues = "https://github.com/nakulben/whatsapp-mcp/issues"

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.__main__:main"

[tool.hatch.version]
path = "whatsapp_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["whatsapp_mcp"]
